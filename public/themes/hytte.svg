<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 150">
  <!-- Hytte theme art: a log cabin with glowing windows, pines, snow and a moon. -->
  <style>
    .smoke { fill: #fff7ea; animation: rise 4s ease-in-out infinite; }
    .s2 { animation-delay: -1.3s; }
    .s3 { animation-delay: -2.6s; }
    @keyframes rise { 0% { transform: translate(0, 8px) scale(.7); opacity: 0; } 30% { opacity: .45; } 100% { transform: translate(5px, -9px) scale(1.2); opacity: 0; } }
    .flicker { animation: flick 3.4s ease-in-out infinite; }
    @keyframes flick { 0%, 100% { opacity: 1; } 45% { opacity: .82; } 60% { opacity: .95; } }
    @media (prefers-reduced-motion: reduce) { .smoke, .flicker { animation: none; } .smoke { opacity: .3; } }
  </style>
  <defs>
    <radialGradient id="glow"><stop offset="0" stop-color="#ffd36b" stop-opacity=".6"/><stop offset="1" stop-color="#ffd36b" stop-opacity="0"/></radialGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffeab0"/><stop offset="1" stop-color="#ffb347"/></linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff9ee"/><stop offset="1" stop-color="#e3d7c0"/></linearGradient>
  </defs>

