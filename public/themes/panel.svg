  <rect width="480" height="960" filter="url(#fine)" opacity=".34"/>
  <rect x="0" width="96" height="960" fill="url(#round)"/><rect x="96" width="96" height="960" fill="url(#round)"/><rect x="192" width="96" height="960" fill="url(#round)"/><rect x="288" width="96" height="960" fill="url(#round)"/><rect x="384" width="96" height="960" fill="url(#round)"/>
