<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 140">
  <!-- Kos theme art: a steaming mug of hot chocolate in falling snow. -->
  <style>
    .steam { fill: none; stroke: #fff4e6; stroke-width: 4; stroke-linecap: round; opacity: .75; animation: rise 3.2s ease-in-out infinite; }
    .s2 { animation-delay: -1.1s; }
    .s3 { animation-delay: -2.2s; }
    @keyframes rise { 0% { transform: translateY(6px); opacity: 0; } 40% { opacity: .8; } 100% { transform: translateY(-10px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .steam { animation: none; } }
  </style>

  <!-- snow -->
  <g fill="#fff4e6" opacity=".7">
    <circle cx="20" cy="18" r="2"/><circle cx="128" cy="14" r="1.5"/><circle cx="244" cy="22" r="2"/>
    <circle cx="344" cy="12" r="1.5"/><circle cx="110" cy="58" r="1.2"/><circle cx="236" cy="70" r="1.4"/>
    <circle cx="352" cy="96" r="1.8"/><circle cx="8" cy="104" r="1.4"/>
  </g>

  <!-- hot chocolate, centred -->
  <g transform="translate(180 72) scale(1.2) translate(-194 -71)">
  <path class="steam" d="M168 40c-6-8 6-12 0-20"/>
  <path class="steam s2" d="M182 38c-6-8 6-12 0-20"/>
  <path class="steam s3" d="M196 40c-6-8 6-12 0-20"/>
  <path d="M216 72h8a14 14 0 0 1 0 28h-8" fill="none" stroke="#b3263a" stroke-width="7"/>
  <path d="M150 56h68v48a20 20 0 0 1-20 20h-28a20 20 0 0 1-20-20Z" fill="#b3263a"/>
  <!-- a band of little Selbu roses on the mug -->
  <rect x="150" y="80" width="68" height="14" fill="#fff4e6"/>
  <g fill="#b3263a">
    <path d="M160 82l3 5-3 5-3-5Z"/><path d="M176 82l3 5-3 5-3-5Z"/><path d="M192 82l3 5-3 5-3-5Z"/><path d="M208 82l3 5-3 5-3-5Z"/>
  </g>
  <ellipse cx="184" cy="56" rx="34" ry="7" fill="#5a3324"/>
  <g fill="#fffaf3"><circle cx="174" cy="53" r="6"/><circle cx="186" cy="51" r="7"/><circle cx="197" cy="54" r="5"/></g>

  </g>
</svg>
